<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/typeface-montserrat@1.1.13/index.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">  
  <link rel="stylesheet" href="CSS/style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>  <!-- CDN BOOSTRAP -->
   
  <script src="SCRIPTS/productos.js" defer></script>
  <script src="SCRIPTS/categorias.js" defer></script>
    <script src="SCRIPTS/ventas.js" defer></script> 
  <title>Productos</title>
</head>
<body>
  <header>
        <h1>PetShop TUC 🐾 </h1>
  </header>

  <main>
    <!--================= CATEGORIAS =================-->
           <section>
            <h2>Categorias</h2>
            <form id="formCategoria">
                <input type="text" id="nombreCategoria" placeholder="Nombre de la categoria" class="input">
                <input type="text" id="descripcionCategoria" placeholder="Descripcion" class="input">

            <button type="submit" class="btn btn-info w-100 mt-2">
                    Agregar Categoria
            </button>
            </form>

                <hr>
                
                <div id="contenedorCategorias" class="contenedor-categorias">
                    
                </div>
                <hr>
                
           </section>
    <button type="button" class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#ModalProductos">
      Agregar Producto
    </button>
    

      <!-- Modal Productos -->
      <div class="modal fade" id="ModalProductos" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="exampleModalLabel">Agregar Producto</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <section class="productos-section">
            <div class="productos-form">
              <div class="inputs">
                <div>
                <label><strong>Nombre del producto</strong></label>
                <input class="input" type="text" id="nombreProducto" autocomplete="off">
              </div>
              <div>
                <label><strong>Descripción</strong></label>
                <input class="input descripcionProducto" type="text" id="descProducto" autocomplete="off">
              </div>
              <div>
                
                <label><strong>Precio</strong></label>
                <input class="input" type="text" id="precioProducto" autocomplete="off">
              </div>
              <div>
                <label><strong>Stock</strong></label>
                <input class="input" type="text" id="stockProducto" autocomplete="off">
              </div>
            
            </div>
              
              <div class="selectCategoria">
                <select id="selectCategoria" class="input-productos">
                  <option selected disabled="disabled">Seleccionar Categoria</option>
                </select>
              </div>
            </div>
            
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-danger " data-bs-dismiss="modal">Close</button>
              <button id="btnAgregar" type="button" onclick="cargarProducto()" class="btn btn-primary" data-bs-dismiss="modal">Cargar Producto</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Button trigger modal -->


<!-- Modal Crear Venta -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Nueva venta</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">

        <div class="mb-3">
          <label for="inputCliente" class="form-label">Nombre del cliente</label>
          <input type="text" class="form-control" id="inputCliente" placeholder="Ej: María González" autocomplete="off">
        </div>

        <div class="mb-3">
          <label for="selectProducto" class="form-label">Producto</label>
          <select class="form-select" id="selectProducto">
            <option>Selecciona un producto</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="inputCantidad" class="form-label">Cantidad</label>
          <input type="number" class="form-control" id="inputCantidad" min="1" placeholder="Ej: 2" autocomplete="off">
        </div>

        <div class="mb-3">
          <label for="inputTotal" class="form-label">Total</label>
          <input type="number" class="form-control" id="inputTotal" readonly placeholder="Se calcula automáticamente">
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button onclick="Crearcliente()" type="button" class="btn btn-primary" id="btnGuardar">Guardar venta</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Editar Venta -->
<div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5">Editar venta</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">

        <div class="mb-3">
          <label for="inputClienteEditar" class="form-label">Nombre del cliente</label>
          <input type="text" class="form-control" id="inputClienteEditar" autocomplete="off">
        </div>

        <div class="mb-3">
          <label for="inputCantidadEditar" class="form-label">Cantidad</label>
          <input type="number" class="form-control" id="inputCantidadEditar" min="1">
        </div>

        <div class="mb-3">
          <label for="inputTotalEditar" class="form-label">Total</label>
          <input type="number" class="form-control" id="inputTotalEditar">
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button onclick="GuardarCambios()" type="button" class="btn btn-primary">Guardar cambios</button>
      </div>
    </div>
  </div>
</div>

<br>
<h3>Filtrar Productos</h3>
                <div id="filtrosCategorias"></div>
            <div class="productos" id="productos">

            </div>

            <button type="button" class="btn btn-success mt-5 mb-5" data-bs-toggle="modal" data-bs-target="#exampleModal">Comprar</button>
            <table class="table">
              <thead>
                <tr>
                  <th scope="col">#</th>
                  <th scope="col">Producto</th>
                  <th scope="col">Cliente</th>
                  <th scope="col">Cantidad</th>
                  <th scope="col">Total</th>
                  <th scope="col">Fecha</th>
                  <th scope="col">Acciones</th>
                </tr>
              </thead>
            <tbody id="TablaVentas">
            
            </tbody>
          </table>
          <div class="modal fade" id="modalHistorial" tabindex="-1" aria-labelledby="modalHistorialLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title fs-5" id="modalHistorialLabel">Historial de ventas</h1>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <table class="table">
                    <thead>
                      <tr>
                        <th>Cliente</th>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Total</th>
                        <th>Fecha</th>
                      </tr>
                    </thead>
                    <tbody id="TablaHistorial">

                    </tbody>
                  </table>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
              </div>
            </div>
          </div>
          
  </main>
</body>
</html>
